<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".62" numOctaves="4" seed="9324" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono">
      <feFuncR type="gamma" amplitude="1" exponent="1.18" offset="0"/>
      <feFuncG type="gamma" amplitude="1" exponent="1.18" offset="0"/>
      <feFuncB type="gamma" amplitude="1" exponent="1.18" offset="0"/>
      <feFuncA type="linear" slope="0" intercept=".2"/>
    </feComponentTransfer>
  </filter>
  <rect width="128" height="128" filter="url(#grain)"/>
</svg>
